######## Stellar info ########
stellar:
  version: '1.33.1'
  homepage: 'https://xaoxuu.com/wiki/stellar/'
  repo: 'https://github.com/xaoxuu/hexo-theme-stellar'
  main_css: /css/main.css
  main_js: /js/main.js


######## head tags ########
preconnect:
  # - https://gcore.jsdelivr.net
  # - https://gcore.jsdelivr.net
  # - https://unpkg.com

# 引入自定义 CSS
inject:
  script:
    - '<script defer src="/js/site-experience.js?v=20261023"></script>'
  head:
    - '<link rel="stylesheet" href="/css/custom.css?v=20261026">'
    - '<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>'

# 一旦设置源站地址，非源站地址将不会被SEO收录，并且访问时弹出提示
# 如果访问地址不在备用站主机列表，则警告信息为非法克隆
canonical:
  originalHost: # 主站点域名主机，例如 xaoxuu.com
  officialHosts: # 官方主机列表，每行一个，例如 xaoxuu.vercel.app
    - localhost

open_graph:
  enable: true
  twitter_id: # for open_graph meta

structured_data:
  links: [] # your social links.


######## Sidebar ########
# 左上角显示的 logo 区域，包含图标、大标题、副标题
