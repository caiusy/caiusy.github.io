<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-label="01_overview.svg">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1424"/><stop offset="1" stop-color="#10233a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#84a6c8" stroke-width="2"/></marker></defs>
<rect width="1200" height="510" rx="24" fill="url(#bg)"/>
<style>text{font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#eef5ff} .title{font-size:30px;font-weight:700} .sub{font-size:16px;fill:#a8bdd3} .label{font-size:22px;font-weight:700} .small{font-size:15px;fill:#b8cce0} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<text x="54" y="65" class="title" text-anchor="start">DeepSeek Sparse Attention · 两阶段读取</text><text x="54" y="96" class="sub" text-anchor="start">先在轻量索引上扫描，再从压缩缓存中按位置读取</text><rect x="54" y="150" width="280" height="125" rx="17" fill="#142b47" stroke="#5ea8ff" stroke-width="2"/><text x="74" y="187" class="label" text-anchor="start">当前 token</text><text x="74" y="215" class="small" text-anchor="start">qₜ + gₜ 负责提问</text><rect x="458" y="150" width="280" height="125" rx="17" fill="#142b47" stroke="#f3b15b" stroke-width="2"/><text x="478" y="187" class="label" text-anchor="start">Lightning Indexer</text><text x="478" y="215" class="small" text-anchor="start">扫描全部历史 kₛ → 排序</text><rect x="862" y="150" width="280" height="125" rx="17" fill="#142b47" stroke="#4dd2ad" stroke-width="2"/><text x="882" y="187" class="label" text-anchor="start">Sparse MLA</text><text x="882" y="215" class="small" text-anchor="start">只处理 Top-K 位置</text><path d="M335 213 L449 213" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><path d="M739 213 L853 213" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="458" y="345" width="280" height="105" rx="17" fill="#142b47" stroke="#f3b15b" stroke-width="2"/><text x="478" y="382" class="label" text-anchor="start">Indexer K Cache</text><text x="478" y="410" class="small" text-anchor="start">每位置 128 B 核心数据</text><rect x="862" y="345" width="280" height="105" rx="17" fill="#142b47" stroke="#4dd2ad" stroke-width="2"/><text x="882" y="382" class="label" text-anchor="start">MLA 压缩 Cache</text><text x="882" y="410" class="small" text-anchor="start">cᴷⱽ + PE，提供注意力信息</text><path d="M598 344 L598 282" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1002 344 L1002 282" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><text x="54" y="420" class="label" text-anchor="start">输出是历史位置索引</text><text x="54" y="452" class="small" text-anchor="start">Top-K 不是选 Head；Indexer 不产生最终 Attention 输出。</text></svg>