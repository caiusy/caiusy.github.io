<text x="54" y="62" class="title" text-anchor="start">一个历史位置如何得到 0.7 分</text><text x="54" y="92" class="sub" text-anchor="start">教学数值：token 9 查询 token 5；三个 Query Head 共用同一个 k₅</text><rect x="54" y="145" width="1090" height="72" rx="14" fill="#142b47" stroke="#5ea8ff"/><text x="78" y="189" class="label" text-anchor="start">Head 1</text><text x="326" y="189" class="mono" text-anchor="start">2.0</text><text x="532" y="189" class="mono" text-anchor="start">2.0</text><text x="734" y="189" class="mono" text-anchor="start">+0.8</text><text x="969" y="189" class="mono" text-anchor="start">+1.60</text><rect x="54" y="235" width="1090" height="72" rx="14" fill="#142b47" stroke="#4dd2ad"/><text x="78" y="279" class="label" text-anchor="start">Head 2</text><text x="326" y="279" class="mono" text-anchor="start">−1.0</text><text x="532" y="279" class="mono" text-anchor="start">0.0</text><text x="734" y="279" class="mono" text-anchor="start">+0.2</text><text x="969" y="279" class="mono" text-anchor="start">0.00</text><rect x="54" y="325" width="1090" height="72" rx="14" fill="#142b47" stroke="#f3b15b"/><text x="78" y="369" class="label" text-anchor="start">Head 3</text><text x="326" y="369" class="mono" text-anchor="start">3.0</text><text x="532" y="369" class="mono" text-anchor="start">3.0</text><text x="734" y="369" class="mono" text-anchor="start">−0.3</text><text x="969" y="369" class="mono" text-anchor="start">−0.90</text><text x="326" y="126" class="small" text-anchor="start">qⱼ · k₅</text><text x="532" y="126" class="small" text-anchor="start">ReLU</text><text x="734" y="126" class="small" text-anchor="start">当前 g₉,ⱼ</text><text x="969" y="126" class="small" text-anchor="start">乘积</text><rect x="54" y="438" width="1090" height="72" rx="14" fill="#203e5a" stroke="#eef5ff"/><text x="79" y="483" class="label" text-anchor="start">求和 → r₉,₅ = 1.60 + 0 − 0.90 = 0.70</text></svg>