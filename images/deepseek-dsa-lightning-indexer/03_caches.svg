<style>text{font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#eef5ff} .title{font-size:30px;font-weight:700} .sub{font-size:16px;fill:#a8bdd3} .label{font-size:22px;font-weight:700} .small{font-size:15px;fill:#b8cce0} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<text x="54" y="65" class="title" text-anchor="start">每历史 token · 每层的核心缓存</text><text x="54" y="96" class="sub" text-anchor="start">对数刻度；不含量化 scale 等元数据。三者不是同一种缓存。</text><text x="54" y="176" class="label" text-anchor="start">传统 MHA K/V</text><text x="54" y="202" class="small" text-anchor="start">128 头 × 128 维 × K/V × BF16</text><rect x="450" y="146" width="796.0" height="42" rx="9" fill="#758ea9"/><text x="1260.9551833496878" y="175" class="label" text-anchor="start">65,536 B</text><text x="54" y="281" class="label" text-anchor="start">MLA 压缩缓存</text><text x="54" y="307" class="small" text-anchor="start">(512 + 64) 维 × BF16</text><rect x="450" y="251" width="374.7" height="42" rx="9" fill="#4dd2ad"/><text x="839.7485949809263" y="280" class="label" text-anchor="start">1,152 B</text><text x="54" y="386" class="label" text-anchor="start">Indexer Key</text><text x="54" y="412" class="small" text-anchor="start">128 维 × FP8</text><rect x="450" y="356" width="145.7" height="42" rx="9" fill="#f3b15b"/><text x="610.7303927154884" y="385" class="label" text-anchor="start">128 B</text><text x="54" y="480" class="small" text-anchor="start">同等历史长度下：Indexer 单位置约为 MLA 的 1/9；它仍需扫描全历史。</text></svg>