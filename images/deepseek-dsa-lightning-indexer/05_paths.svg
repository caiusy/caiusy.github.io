<style>text{font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#eef5ff} .title{font-size:30px;font-weight:700} .sub{font-size:16px;fill:#a8bdd3} .label{font-size:22px;font-weight:700} .small{font-size:15px;fill:#b8cce0} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<text x="54" y="63" class="title" text-anchor="start">当前 token 的三条 Indexer 路径</text><text x="54" y="94" class="sub" text-anchor="start">共享的是参数；q、k、g 都是当前 token 的动态值。</text><rect x="54" y="192" width="220" height="104" rx="17" fill="#142b47" stroke="#5ea8ff" stroke-width="2"/><text x="74" y="229" class="label" text-anchor="start">h₉</text><text x="74" y="257" class="small" text-anchor="start">当前隐藏状态</text><rect x="460" y="125" width="220" height="90" rx="17" fill="#142b47" stroke="#5ea8ff" stroke-width="2"/><text x="480" y="162" class="label" text-anchor="start">W_Qᴵ</text><text x="480" y="190" class="small" text-anchor="start">q₉,₁ … q₉,ᴴ</text><path d="M275 244 L450 170" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="460" y="257" width="220" height="90" rx="17" fill="#142b47" stroke="#f3b15b" stroke-width="2"/><text x="480" y="294" class="label" text-anchor="start">W_Kᴵ</text><text x="480" y="322" class="small" text-anchor="start">k₉ → 缓存</text><path d="M275 244 L450 302" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="460" y="389" width="220" height="90" rx="17" fill="#142b47" stroke="#4dd2ad" stroke-width="2"/><text x="480" y="426" class="label" text-anchor="start">W_Gᴵ</text><text x="480" y="454" class="small" text-anchor="start">g₉,₁ … g₉,ᴴ</text><path d="M275 244 L450 434" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/></svg>