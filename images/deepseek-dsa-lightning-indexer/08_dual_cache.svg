<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="08_dual_cache.svg">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1424"/><stop offset="1" stop-color="#10233a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#84a6c8" stroke-width="2"/></marker></defs>
<rect width="1200" height="500" rx="24" fill="url(#bg)"/>
<style>text{font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#eef5ff} .title{font-size:30px;font-weight:700} .sub{font-size:16px;fill:#a8bdd3} .label{font-size:22px;font-weight:700} .small{font-size:15px;fill:#b8cce0} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<text x="54" y="65" class="title" text-anchor="start">两套缓存负责两件事</text><text x="54" y="96" class="sub" text-anchor="start">Indexer 先选位置；Sparse MLA 再按位置读压缩表示。</text><rect x="54" y="160" width="330" height="120" rx="17" fill="#142b47" stroke="#f3b15b" stroke-width="2"/><text x="74" y="197" class="label" text-anchor="start">Indexer K Cache</text><text x="74" y="225" class="small" text-anchor="start">k₁ … kₜ：全部扫描</text><rect x="462" y="160" width="276" height="120" rx="17" fill="#142b47" stroke="#5ea8ff" stroke-width="2"/><text x="482" y="197" class="label" text-anchor="start">Top-K indices</text><text x="482" y="225" class="small" text-anchor="start">例如 [6, 2, 7]</text><rect x="816" y="160" width="330" height="120" rx="17" fill="#142b47" stroke="#4dd2ad" stroke-width="2"/><text x="836" y="197" class="label" text-anchor="start">MLA 压缩 Cache</text><text x="836" y="225" class="small" text-anchor="start">cᴷⱽ + PE：按位置读取</text><path d="M385 220 L451 220" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><path d="M739 220 L805 220" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="816" y="350" width="330" height="95" rx="17" fill="#142b47" stroke="#4dd2ad" stroke-width="2"/><text x="836" y="387" class="label" text-anchor="start">Sparse MLA</text><text x="836" y="415" class="small" text-anchor="start">输出注意力结果 oₜ</text><path d="M981 282 L981 340" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><text x="54" y="414" class="label" text-anchor="start">位置索引连接两阶段；两套缓存互不替代。</text></svg>