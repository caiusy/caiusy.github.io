<text x="54" y="65" class="title" text-anchor="start">单 token 完整推理链路</text><text x="54" y="96" class="sub" text-anchor="start">先找到值得读的位置，再读取真正的信息。</text><rect x="54" y="150" width="300" height="110" rx="17" fill="#142b47" stroke="#5ea8ff" stroke-width="2"/><text x="74" y="187" class="label" text-anchor="start">hₜ</text><text x="74" y="215" class="small" text-anchor="start">当前状态</text><path d="M355 205 L424 205" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="434" y="150" width="300" height="110" rx="17" fill="#142b47" stroke="#5ea8ff" stroke-width="2"/><text x="454" y="187" class="label" text-anchor="start">qₜ + gₜ</text><text x="454" y="215" class="small" text-anchor="start">当前查询</text><path d="M735 205 L804 205" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="814" y="150" width="300" height="110" rx="17" fill="#142b47" stroke="#f3b15b" stroke-width="2"/><text x="834" y="187" class="label" text-anchor="start">全历史 k Cache</text><text x="834" y="215" class="small" text-anchor="start">轻量扫描</text><rect x="54" y="350" width="300" height="110" rx="17" fill="#142b47" stroke="#f3b15b" stroke-width="2"/><text x="74" y="387" class="label" text-anchor="start">Top-K</text><text x="74" y="415" class="small" text-anchor="start">位置索引</text><path d="M355 405 L424 405" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="434" y="350" width="300" height="110" rx="17" fill="#142b47" stroke="#4dd2ad" stroke-width="2"/><text x="454" y="387" class="label" text-anchor="start">MLA cᴷⱽ + PE</text><text x="454" y="415" class="small" text-anchor="start">稀疏读取</text><path d="M735 405 L804 405" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="814" y="350" width="300" height="110" rx="17" fill="#142b47" stroke="#4dd2ad" stroke-width="2"/><text x="834" y="387" class="label" text-anchor="start">oₜ</text><text x="834" y="415" class="small" text-anchor="start">输出</text><p