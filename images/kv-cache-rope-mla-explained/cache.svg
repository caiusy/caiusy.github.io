<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#183b36}.label{font-size:21px;font-weight:600}.sub{font-size:16px;fill:#5f746b}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#779087"/></marker></defs><rect width="1000" height="480" rx="16" fill="#f1f3e9"/><text x="36" y="48" font-size="26" font-weight="700">01 / 新位置带来新 Query，历史材料继续复用</text><text x="36" y="80" class="sub">每层独立保存历史 K、V；只计算当前注意力的新一行。</text><path d="M235 180L310 165" stroke="#779087" stroke-width="2" marker-end="url(#arrow)"/><path d="M235 195L310 300" stroke="#779087" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 305L620 305" stroke="#779087" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 165L665 165" stroke="#779087" stroke-width="2" marker-end="url(#arrow)"/><path d="M780 245L780 205" stroke="#779087" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="135" width="200" height="100" rx="9" fill="#fff" stroke="#c3d0c4"/><text x="135.0" y="182.0" text-anchor="middle" class="label">当前 hₜ</text><text x="135.0" y="209.0" text-anchor="middle" class="sub">本步输入</text><rect x="310" y="120" width="230" height="90" rx="9" fill="#fae0c3" stroke="#c3d0c4"/><text x="425.0" y="162.0" text-anchor="middle" class="label">qₜ</text><text x="425.0" y="189.0" text-anchor="middle" class="sub">本步查询，用完释放</text><rect x="310" y="255" width="230" height="100" rx="9" fill="#dde9df" stroke="#c3d0c4"/><text x="425.0" y="302.0" text-anchor="middle" class="label">kₜ / vₜ</text><text x="425.0" y="329.0" text-anchor="middle" class="sub">追加一条新记录</text><rect x="620" y="245" width="325" height="115" rx="9" fill="#dde9df" stroke="#c3d0c4"/><text x="782.5" y="299.5" text-anchor="middle" class="label">历史 K₁:ₜ / V₁:ₜ</text><text x="782.5" y="326.5" text-anchor="middle" class="sub">未来步骤重复读取</text><rect x="665" y="115" width="235" height="90" rx="9" fill="#fff" stroke="#c3d0c4"/><text x="782.5" y="157.0" text-anchor="middle" class="label">oₜ = αₜ V₁:ₜ</text><text x="782.5" y="184.0" text-anchor="middle" class="sub">预测链路中的新输出</text><text x="36" y="447" class="sub">Q 决定本次读取什么；KV 保存未来仍需访问的信息。</text></svg>