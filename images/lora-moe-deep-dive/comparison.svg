<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" style="font-family:Inter,Segoe UI,sans-serif;">
  <defs>
    <linearGradient id="bgc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="loraH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/><stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="moeH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/><stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="rowA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rowB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="url(#bgc)" rx="14"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
  </g>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="url(#tg)">LoRA × MoE — 两张底牌的本质对比</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#475569">两者不互斥：MoE 扩容，LoRA 低成本适配</text>

  <!-- Column headers -->
  <rect x="170" y="72" width="240" height="36" rx="8" fill="url(#loraH)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="290" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#38bdf8">LoRA · 低秩适配</text>

  <rect x="490" y="72" width="240" height="36" rx="8" fill="url(#moeH)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="610" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#a78bfa">MoE · 混合专家</text>

  <!-- Row label column -->
  <rect x="30" y="72" width="132" height="36" rx="8" fill="#0a0f1a" stroke="#1e293b" stroke-width="1"/>
  <text x="96" y="96" text-anchor="middle" font-size="12" fill="#64748b">维度</text>

  <!-- Rows -->
  <!-- Row 1 -->
  <rect x="30"  y="116" width="132" height="40" rx="0" fill="url(#rowA)"/>
  <rect x="170" y="116" width="240" height="40" fill="url(#rowA)"/>
  <rect x="490" y="116" width="240" height="40" fill="url(#rowA)"/>
  <line x1="30" y1="116" x2="730" y2="116" stroke="#1e293b" stroke-width="1"/>
  <text x="96"  y="142" text-anchor="middle" font-size="11" fill="#64748b">解决问题</text>
  <text x="290" y="142" text-anchor="middle" font-size="12" fill="#7dd3fc">微调成本过高</text>
  <text x="610" y="142" text-anchor="middle" font-size="12" fill="#c4b5fd">扩容时算力线性增长</text>

  <!-- Row 2 -->
  <rect x="30"  y="156" width="132" height="40" fill="url(#rowB)"/>
  <rect x="170" y="156" width="240" height="40" fill="url(#rowB)"/>
  <rect x="490" y="156" width="240" height="40" fill="url(#rowB)"/>
  <line x1="30" y1="156" x2="730" y2="156" stroke="#1e293b" stroke-width="1"/>
  <text x="96"  y="182" text-anchor="middle" font-size="11" fill="#64748b">核心假设</text>
  <text x="290" y="182" text-anchor="middle" font-size="12" fill="#7dd3fc">ΔW 内在秩极低</text>
  <text x="610" y="182" text-anchor="middle" font-size="12" fill="#c4b5fd">每 token 仅需部分专家</text>

  <!-- Row 3 -->
  <rect x="30"  y="196" width="132" height="40" fill="url(#rowA)"/>
  <rect x="170" y="196" width="240" height="40" fill="url(#rowA)"/>
  <rect x="490" y="196" width="240" height="40" fill="url(#rowA)"/>
  <line x1="30" y1="196" x2="730" y2="196" stroke="#1e293b" stroke-width="1"/>
  <text x="96"  y="222" text-anchor="middle" font-size="11" fill="#64748b">数学手段</text>
  <text x="290" y="222" text-anchor="middle" font-size="12" fill="#7dd3fc">ΔW = BA，低秩分解</text>
  <text x="610" y="222" text-anchor="middle" font-size="12" fill="#c4b5fd">稀疏路由，条件计算</text>

  <!-- Row 4 -->
  <rect x="30"  y="236" width="132" height="40" fill="url(#rowB)"/>
  <rect x="170" y="236" width="240" height="40" fill="url(#rowB)"/>
  <rect x="490" y="236" width="240" height="40" fill="url(#rowB)"/>
  <line x1="30" y1="236" x2="730" y2="236" stroke="#1e293b" stroke-width="1"/>
  <text x="96"  y="262" text-anchor="middle" font-size="11" fill="#64748b">可训练参数</text>
  <text x="290" y="262" text-anchor="middle" font-size="12" fill="#34d399">原始的 0.1% ~ 1%</text>
  <text x="610" y="262" text-anchor="middle" font-size="12" fill="#fbbf24">全部（专家 + 路由器）</text>

  <!-- Row 5 -->
  <rect x="30"  y="276" width="132" height="40" fill="url(#rowA)"/>
  <rect x="170" y="276" width="240" height="40" fill="url(#rowA)"/>
  <rect x="490" y="276" width="240" height="40" fill="url(#rowA)"/>
  <line x1="30" y1="276" x2="730" y2="276" stroke="#1e293b" stroke-width="1"/>
  <text x="96"  y="302" text-anchor="middle" font-size="11" fill="#64748b">推理开销</text>
  <text x="290" y="302" text-anchor="middle" font-size="12" fill="#34d399">合并后零额外开销 ✓</text>
  <text x="610" y="302" text-anchor="middle" font-size="12" fill="#c4b5fd">每 token 激活 K/E 比例</text>

  <!-- Row 6 -->
  <rect x="30"  y="316" width="132" height="40" fill="url(#rowB)"/>
  <rect x="170" y="316" width="240" height="40" fill="url(#rowB)"/>
  <rect x="490" y="316" width="240" height="40" fill="url(#rowB)"/>
  <line x1="30" y1="316" x2="730" y2="316" stroke="#1e293b" stroke-width="1"/>
  <text x="96"  y="342" text-anchor="middle" font-size="11" fill="#64748b">核心风险</text>
  <text x="290" y="342" text-anchor="middle" font-size="12" fill="#f87171">秩太小 → 欠拟合</text>
  <text x="610" y="342" text-anchor="middle" font-size="12" fill="#f87171">路由崩塌，专家不均</text>

  <!-- Border -->
  <rect x="30" y="116" width="700" height="240" rx="0" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Bottom note -->
  <rect x="30" y="364" width="700" height="26" rx="6" fill="#0a0f1a" stroke="#1e293b" stroke-width="1"/>
  <text x="380" y="382" text-anchor="middle" font-size="11" fill="#475569">💡 现代 LLM 常以 MoE 扩容知识容量，以 LoRA 做低成本下游适配——两者是互补关系</text>

  <!-- Vertical divider between LoRA and MoE columns -->
  <line x1="450" y1="72" x2="450" y2="356" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Typical params panel -->
  <rect x="740" y="116" width="140" height="120" rx="8" fill="#0a0f1a" stroke="#38bdf8" stroke-width="1"/>
  <text x="810" y="138" text-anchor="middle" font-size="11" font-weight="600" fill="#7dd3fc">LoRA 典型超参</text>
  <line x1="750" y1="145" x2="870" y2="145" stroke="#0c4a6e" stroke-width="1"/>
  <text x="810" y="162" text-anchor="middle" font-size="11" fill="#94a3b8">r = 8 ~ 64</text>
  <text x="810" y="180" text-anchor="middle" font-size="11" fill="#94a3b8">α = r ~ 2r</text>
  <text x="810" y="198" text-anchor="middle" font-size="11" fill="#94a3b8">target: Q, V proj</text>
  <text x="810" y="216" text-anchor="middle" font-size="11" fill="#34d399">显存节省 ~8×</text>
  <text x="810" y="232" text-anchor="middle" font-size="10" fill="#64748b">0.1B → 0.26M 可训练</text>

  <rect x="740" y="248" width="140" height="120" rx="8" fill="#0a0f1a" stroke="#a78bfa" stroke-width="1"/>
  <text x="810" y="270" text-anchor="middle" font-size="11" font-weight="600" fill="#c4b5fd">MoE 典型超参</text>
  <line x1="750" y1="277" x2="870" y2="277" stroke="#3b0764" stroke-width="1"/>
  <text x="810" y="294" text-anchor="middle" font-size="11" fill="#94a3b8">E = 4 ~ 64 专家</text>
  <text x="810" y="312" text-anchor="middle" font-size="11" fill="#94a3b8">K = 1 ~ 2 激活</text>
  <text x="810" y="330" text-anchor="middle" font-size="11" fill="#94a3b8">λ_aux = 5e-4</text>
  <text x="810" y="348" text-anchor="middle" font-size="11" fill="#fbbf24">容量 E×，算力 K×</text>
  <text x="810" y="364" text-anchor="middle" font-size="10" fill="#64748b">E=4,K=1 → 性价比 4×</text>
</svg>
