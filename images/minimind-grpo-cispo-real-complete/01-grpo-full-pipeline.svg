<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GRPO/CISPO 真实四候选完整链路</title>
  <desc id="desc">同一 prompt → 4 条 rollout → reward 分组 → advantage → token loss</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071126"/><stop offset="1" stop-color="#152A48"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#94A3B8"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.5"/></filter>
  </defs>
  <style>
    .title { font: 700 54px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#F8FAFC; }
    .subtitle { font: 400 25px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#CBD5E1; }
    .card-head { font: 700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#F8FAFC; }
    .card-text { font: 600 25px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#E2E8F0; }
    .sub { font: 400 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#CBD5E1; }
    .ref { font: 650 27px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#F8FAFC; }
  </style>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="230" fill="#2563EB" opacity="0.12"/><circle cx="120" cy="820" r="260" fill="#7C3AED" opacity="0.10"/>
  <g filter="url(#shadow)"><rect x="65" y="58" width="1470" height="165" rx="34" fill="#0F1B31" stroke="#334155" stroke-width="2"/></g>
  <text x="110" y="132" class="title">GRPO/CISPO 真实四候选完整链路</text>
  <text x="110" y="184" class="subtitle">同一 prompt → 4 条 rollout → reward 分组 → advantage → token loss</text>
  <rect x="90" y="350" width="220" height="180" rx="28" fill="#111C34" stroke="#2563EB" stroke-width="5"/>
<text x="200" y="420" text-anchor="middle" class="card-head">Prompt</text>
<text x="200" y="475" text-anchor="middle" class="card-text">[1,561]</text>
<rect x="390" y="350" width="220" height="180" rx="28" fill="#111C34" stroke="#7C3AED" stroke-width="5"/>
<text x="500" y="420" text-anchor="middle" class="card-head">4 Rollouts</text>
<text x="500" y="475" text-anchor="middle" class="card-text">[4,256]</text>
<rect x="690" y="350" width="220" height="180" rx="28" fill="#111C34" stroke="#D97706" stroke-width="5"/>
<text x="800" y="420" text-anchor="middle" class="card-head">Rewards</text>
<text x="800" y="475" text-anchor="middle" class="card-text">[4]</text>
<rect x="990" y="350" width="220" height="180" rx="28" fill="#111C34" stroke="#EC4899" stroke-width="5"/>
<text x="1100" y="420" text-anchor="middle" class="card-head">Advantages</text>
<text x="1100" y="475" text-anchor="middle" class="card-text">[4] → [4,256]</text>
<rect x="1290" y="350" width="220" height="180" rx="28" fill="#111C34" stroke="#059669" stroke-width="5"/>
<text x="1400" y="420" text-anchor="middle" class="card-head">CISPO Step</text>
<text x="1400" y="475" text-anchor="middle" class="card-text">θ update</text>
<path d="M310 440 H385 M610 440 H685 M910 440 H985 M1210 440 H1285" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="260" y="660" width="1080" height="105" rx="26" fill="#17213A" stroke="#38BDF8" stroke-width="3"/>
<text x="800" y="724" text-anchor="middle" class="ref">同一 prompt → 4 条 rollout → reward 分组 → advantage → token loss</text>
</svg>
