<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reference / Old / Current / New 时间线</title>
  <desc id="desc">冻结 Reference 不更新；Old 是 rollout logp；New 在 optimizer.step 后产生</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071126"/><stop offset="1" stop-color="#152A48"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#94A3B8"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.5"/></filter>
  </defs>
  <style>
    .title { font: 700 54px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#F8FAFC; }
    .subtitle { font: 400 25px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#CBD5E1; }
    .card-head { font: 700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#F8FAFC; }
    .card-text { font: 600 25px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#E2E8F0; }
    .sub { font: 400 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#CBD5E1; }
    .ref { font: 650 27px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#F8FAFC; }
  </style>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="230" fill="#2563EB" opacity="0.12"/><circle cx="120" cy="820" r="260" fill="#7C3AED" opacity="0.10"/>
  <g filter="url(#shadow)"><rect x="65" y="58" width="1470" height="165" rx="34" fill="#0F1B31" stroke="#334155" stroke-width="2"/></g>
  <text x="110" y="132" class="title">Reference / Old / Current / New 时间线</text>
  <text x="110" y="184" class="subtitle">冻结 Reference 不更新；Old 是 rollout logp；New 在 optimizer.step 后产生</text>
  <rect x="90" y="330" width="300" height="230" rx="28" fill="#111C34" stroke="#2563EB" stroke-width="5"/>
<circle cx="132" cy="375" r="18" fill="#2563EB"/>
<text x="165" y="388" class="card-head">T1 · Rollout</text>
<text x="118" y="455" class="card-text">Actor 生成 token</text>
<text x="118" y="500" class="card-text">保存 old logp</text>
<rect x="450" y="330" width="300" height="230" rx="28" fill="#111C34" stroke="#7C3AED" stroke-width="5"/>
<circle cx="492" cy="375" r="18" fill="#7C3AED"/>
<text x="525" y="388" class="card-head">T2 · Fixed targets</text>
<text x="478" y="455" class="card-text">Reward / Reference</text>
<text x="478" y="500" class="card-text">Advantage 固定</text>
<rect x="810" y="330" width="300" height="230" rx="28" fill="#111C34" stroke="#D97706" stroke-width="5"/>
<circle cx="852" cy="375" r="18" fill="#D97706"/>
<text x="885" y="388" class="card-head">T3 · Forward</text>
<text x="838" y="455" class="card-text">Current 对比 Old</text>
<text x="838" y="500" class="card-text">计算 ratio 与 KL</text>
<rect x="1170" y="330" width="300" height="230" rx="28" fill="#111C34" stroke="#059669" stroke-width="5"/>
<circle cx="1212" cy="375" r="18" fill="#059669"/>
<text x="1245" y="388" class="card-head">T4 · Step</text>
<text x="1198" y="455" class="card-text">optimizer.step</text>
<text x="1198" y="500" class="card-text">New → Current</text>
<path d="M390 445 H445 M750 445 H805 M1110 445 H1165" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="330" y="660" width="940" height="110" rx="26" fill="#17213A" stroke="#EC4899" stroke-width="3"/>
<text x="800" y="705" text-anchor="middle" class="ref">Reference θref：训练开始加载，参数全程冻结</text>
<text x="800" y="747" text-anchor="middle" class="sub">每批重新计算 ref logp ≠ 更新 Reference 参数</text>
</svg>
