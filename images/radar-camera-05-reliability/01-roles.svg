<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">雷达不准，先拆开三个问题</title><desc id="desc">同一个目标，可以保留速度、降低位置权重，同时继续核查身份。；方法示意，不代表实验结果。</desc><rect width="1200" height="715" fill="#f3f6fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#18324d"><text x="54" y="65" font-size="34" font-weight="700">雷达不准，先拆开三个问题</text><text x="54" y="108" font-size="21" fill="#526b84">同一个目标，可以保留速度、降低位置权重，同时继续核查身份。</text><rect x="54" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="174" width="6" height="38" rx="3" fill="#2979c7"/><text x="79" y="202" font-size="25" font-weight="700" fill="#2979c7">01 目标真的存在吗？</text><text x="79" y="246" font-size="21">连续观测只是证据之一</text><text x="79" y="280" font-size="21">稳定鬼影也可能持续存在</text><text x="79" y="314" font-size="21">遮挡时没有视觉支持 ≠ 假目标</text><rect x="612" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="174" width="6" height="38" rx="3" fill="#16846a"/><text x="637" y="202" font-size="25" font-weight="700" fill="#16846a">02 位置能用到什么程度？</text><text x="637" y="246" font-size="21">距离与横向误差分别看</text><text x="637" y="280" font-size="21">系统偏差先校正，随机误差再建模</text><text x="637" y="314" font-size="21">视觉投影也需要独立验证</text><rect x="54" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="404" width="6" height="38" rx="3" fill="#bb7130"/><text x="79" y="432" font-size="25" font-weight="700" fill="#bb7130">03 速度能帮助预测吗？</text><text x="79" y="476" font-size="21">检查单位、方向与时间延迟</text><text x="79" y="510" font-size="21">厂商速度不等于独立多普勒真值</text><text x="79" y="544" font-size="21">看未来位置预测是否更准</text><rect x="612" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="404" width="6" height="38" rx="3" fill="#7961ae"/><text x="637" y="432" font-size="25" font-weight="700" fill="#7961ae">04 本次关联是否可信？</text><text x="637" y="476" font-size="21">目标存在，不代表配对正确</text><text x="637" y="510" font-size="21">邻车竞争时暂缓跨源融合</text><text x="637" y="544" font-size="21">存在、关联、定位分别评估</text><text x="54" y="680" font-size="20" fill="#526b84">本文提供分析方法；图中不包含任何现场样本。</text></g></svg>