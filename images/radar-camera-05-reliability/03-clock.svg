<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">时间错了，位置也会看起来错</title><desc id="desc">教学算例：匀速 10 m/s，时间相差 0.2 s，沿路位置可差约 2 m。；方法示意，不代表实验结果。</desc><rect width="1200" height="715" fill="#f3f6fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#18324d"><text x="54" y="65" font-size="34" font-weight="700">时间错了，位置也会看起来错</text><text x="54" y="108" font-size="21" fill="#526b84">教学算例：匀速 10 m/s，时间相差 0.2 s，沿路位置可差约 2 m。</text><rect x="54" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="174" width="6" height="38" rx="3" fill="#2979c7"/><text x="79" y="202" font-size="25" font-weight="700" fill="#2979c7">观测 A：时刻 t</text><text x="79" y="246" font-size="21">同一辆车出现在位置 20 m</text><text x="79" y="280" font-size="21">把时间戳写入公共时间轴</text><text x="79" y="314" font-size="21">区分采集时间、输出时间和接收时间</text><rect x="612" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="174" width="6" height="38" rx="3" fill="#16846a"/><text x="637" y="202" font-size="25" font-weight="700" fill="#16846a">观测 B：时刻 t + 0.2 s</text><text x="637" y="246" font-size="21">同一辆车已经到达位置 22 m</text><text x="637" y="280" font-size="21">直接相减，会误判为定位偏差</text><text x="637" y="314" font-size="21">须按声明的时延符号进行补偿</text><rect x="54" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="404" width="6" height="38" rx="3" fill="#bb7130"/><text x="79" y="432" font-size="25" font-weight="700" fill="#bb7130">估计：只选低歧义运动片段</text><text x="79" y="476" font-size="21">扫描合理范围内的时间偏移</text><text x="79" y="510" font-size="21">联合检查残差、方向和身份连续性</text><text x="79" y="544" font-size="21">不同速度、不同方向交叉验证</text><rect x="612" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="404" width="6" height="38" rx="3" fill="#7961ae"/><text x="637" y="432" font-size="25" font-weight="700" fill="#7961ae">验证：换一段数据再试</text><text x="637" y="476" font-size="21">最优偏移是否保持稳定？</text><text x="637" y="510" font-size="21">序列前、中、后是否发生漂移？</text><text x="637" y="544" font-size="21">若不可辨识，保留不确定范围</text><text x="54" y="680" font-size="20" fill="#526b84">2 m = 10 m/s × 0.2 s；数字仅用于说明时间误差如何转成空间误差。</text></g></svg>