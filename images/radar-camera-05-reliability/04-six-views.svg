<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="945" viewBox="0 0 1200 945" role="img" aria-labelledby="title desc"><title id="title">拿到数据后，先做这六张诊断图</title><desc id="desc">每张图同时标注样本数、有效覆盖范围和统计口径。；方法示意，不代表实验结果。</desc><rect width="1200" height="945" fill="#f3f6fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#18324d"><text x="54" y="65" font-size="34" font-weight="700">拿到数据后，先做这六张诊断图</text><text x="54" y="108" font-size="21" fill="#526b84">每张图同时标注样本数、有效覆盖范围和统计口径。</text><rect x="54" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="174" width="6" height="38" rx="3" fill="#2979c7"/><text x="79" y="202" font-size="25" font-weight="700" fill="#2979c7">01 时间轴健康图</text><text x="79" y="246" font-size="21">横轴时间，纵轴传感器</text><text x="79" y="280" font-size="21">显示缺帧、乱序、重复和数据年龄</text><text x="79" y="314" font-size="21">先找数据链路故障</text><rect x="612" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="174" width="6" height="38" rx="3" fill="#16846a"/><text x="637" y="202" font-size="25" font-weight="700" fill="#16846a">02 空间残差矢量图</text><text x="637" y="246" font-size="21">按距离和方位画残差箭头</text><text x="637" y="280" font-size="21">横向、纵向分开统计中位数和 P95</text><text x="637" y="314" font-size="21">无真值时只能称跨源残差</text><rect x="54" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="404" width="6" height="38" rx="3" fill="#bb7130"/><text x="79" y="432" font-size="25" font-weight="700" fill="#bb7130">03 单轨迹体检图</text><text x="79" y="476" font-size="21">位置、速度、跳变和缺测同轴显示</text><text x="79" y="510" font-size="21">标出 ID 重建及候选关联变化</text><text x="79" y="544" font-size="21">平滑不等于准确</text><rect x="612" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="404" width="6" height="38" rx="3" fill="#7961ae"/><text x="637" y="432" font-size="25" font-weight="700" fill="#7961ae">04 关联竞争图</text><text x="637" y="476" font-size="21">记录第一、第二候选代价差</text><text x="637" y="510" font-size="21">显示配对切换和拥挤区域</text><text x="637" y="544" font-size="21">只统计成功匹配会产生选择偏差</text><rect x="54" y="610" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="634" width="6" height="38" rx="3" fill="#2979c7"/><text x="79" y="662" font-size="25" font-weight="700" fill="#2979c7">05 强度条件分布图</text><text x="79" y="706" font-size="21">同距离、方位、类别内比较强弱</text><text x="79" y="740" font-size="21">检验与失败事件的关系</text><text x="79" y="774" font-size="21">没有点云就不计算点云特征</text><rect x="612" y="610" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="634" width="6" height="38" rx="3" fill="#16846a"/><text x="637" y="662" font-size="25" font-weight="700" fill="#16846a">06 增益与覆盖率图</text><text x="637" y="706" font-size="21">比较融合和基线的分组误差</text><text x="637" y="740" font-size="21">同时报告保留比例与拒绝比例</text><text x="637" y="774" font-size="21">避免靠丢掉难目标获得低误差</text><text x="54" y="910" font-size="20" fill="#526b84">顺序：数据健康 → 对齐 → 单源质量 → 关联 → 可用性 → 实际增益。</text></g></svg>