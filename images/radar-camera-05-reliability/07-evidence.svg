<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">没有真值时，什么能说，什么不能说</title><desc id="desc">独立标签用于判断对错；跨源一致性用于发现问题。；方法示意，不代表实验结果。</desc><rect width="1200" height="715" fill="#f3f6fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#18324d"><text x="54" y="65" font-size="34" font-weight="700">没有真值时，什么能说，什么不能说</text><text x="54" y="108" font-size="21" fill="#526b84">独立标签用于判断对错；跨源一致性用于发现问题。</text><rect x="54" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="174" width="6" height="38" rx="3" fill="#2979c7"/><text x="79" y="202" font-size="25" font-weight="700" fill="#2979c7">无独立标签的观测数据</text><text x="79" y="246" font-size="21">能查缺帧、跳变、漂移和配对竞争</text><text x="79" y="280" font-size="21">能描述雷视残差与覆盖率</text><text x="79" y="314" font-size="21">不能据此报告真实定位准确率</text><rect x="612" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="174" width="6" height="38" rx="3" fill="#16846a"/><text x="637" y="202" font-size="25" font-weight="700" fill="#16846a">独立标注的验证子集</text><text x="637" y="246" font-size="21">分层抽取距离、遮挡与拥挤条件</text><text x="637" y="280" font-size="21">人工核对存在性与跨源身份</text><text x="637" y="314" font-size="21">地面位置需有可说明的标注依据</text><rect x="54" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="404" width="6" height="38" rx="3" fill="#bb7130"/><text x="79" y="432" font-size="25" font-weight="700" fill="#bb7130">ES-MEOT 等公开基准</text><text x="79" y="476" font-size="21">保留公开名称、版本和来源</text><text x="79" y="510" font-size="21">检查标注坐标、目标中心和范围</text><text x="79" y="544" font-size="21">自定义切分必须明确声明</text><rect x="612" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="404" width="6" height="38" rx="3" fill="#7961ae"/><text x="637" y="432" font-size="25" font-weight="700" fill="#7961ae">视觉退化与真实夜间</text><text x="637" y="476" font-size="21">遮挡或降亮度可做压力测试</text><text x="637" y="510" font-size="21">模拟退化不等于夜间实测</text><text x="637" y="544" font-size="21">夜间结论需要相应数据及标签</text><text x="54" y="680" font-size="20" fill="#526b84">公开基准验证算法；现场诊断定位问题；两者都不能自动代表另一个域。</text></g></svg>