<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">最后交付的应是一张“使用说明书”</title><desc id="desc">不是一句“雷达可用”，而是按条件给出证据、权限与退出条件。；方法示意，不代表实验结果。</desc><rect width="1200" height="715" fill="#f3f6fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#18324d"><text x="54" y="65" font-size="34" font-weight="700">最后交付的应是一张“使用说明书”</text><text x="54" y="108" font-size="21" fill="#526b84">不是一句“雷达可用”，而是按条件给出证据、权限与退出条件。</text><rect x="54" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="174" width="6" height="38" rx="3" fill="#2979c7"/><text x="79" y="202" font-size="25" font-weight="700" fill="#2979c7">每个条件格子记录什么？</text><text x="79" y="246" font-size="21">距离、方位、遮挡、运动状态</text><text x="79" y="280" font-size="21">独立轨迹数、有效帧数、拒绝率</text><text x="79" y="314" font-size="21">定位误差、预测误差与失败类型</text><rect x="612" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="174" width="6" height="38" rx="3" fill="#16846a"/><text x="637" y="202" font-size="25" font-weight="700" fill="#16846a">绿色：验证后有稳定收益</text><text x="637" y="246" font-size="21">例如：特定范围内速度预测变准</text><text x="637" y="280" font-size="21">允许已验证的信息维度进入更新</text><text x="637" y="314" font-size="21">持续监测是否偏离训练分布</text><rect x="54" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="404" width="6" height="38" rx="3" fill="#bb7130"/><text x="79" y="432" font-size="25" font-weight="700" fill="#bb7130">黄色：证据不足或结果混合</text><text x="79" y="476" font-size="21">例如：远距离样本过少</text><text x="79" y="510" font-size="21">保守使用或暂缓融合</text><text x="79" y="544" font-size="21">优先补标注，而非补一个任意权重</text><rect x="612" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="404" width="6" height="38" rx="3" fill="#7961ae"/><text x="637" y="432" font-size="25" font-weight="700" fill="#7961ae">红色：错误风险超过收益</text><text x="637" y="476" font-size="21">例如：密集并行车流频繁串轨</text><text x="637" y="510" font-size="21">拒绝当前配对或可疑分量</text><text x="637" y="544" font-size="21">保留其他独立可靠的观测</text><text x="54" y="680" font-size="20" fill="#526b84">颜色仅说明决策含义，不代表已经测得的质量分区。</text></g></svg>