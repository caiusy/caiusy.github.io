<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="t d"><title id="t">三种中心的偏差</title><desc id="d">车辆几何中心、运动参考点和雷达反射中心并不重合</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#f85149"/></marker></defs><rect width="1440" height="820" rx="34" fill="#081b2a"/><style>.h{font:700 44px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f4fbff}.s{font:400 23px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#a7cbd5}.l{font:650 25px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f4fbff}</style><text x="80" y="90" class="h">“中心”并非天然一致</text><text x="80" y="138" class="s">原创教学示意 · 关联前要先定义每个接口的位置语义</text><g transform="translate(260 255)"><path d="M0 100L80 20h520l100 80v250H0z" fill="#255c76" stroke="#78dce8" stroke-width="6"/><circle cx="160" cy="350" r="55" fill="#071721" stroke="#a9d2dc" stroke-width="10"/><circle cx="550" cy="350" r="55" fill="#071721" stroke="#a9d2dc" stroke-width="10"/><circle cx="350" cy="190" r="15" fill="#3fb950"/><circle cx="280" cy="238" r="15" fill="#58a6ff"/><g fill="#ffb86c"><circle cx="510" cy="110" r="12"/><circle cx="575" cy="145" r="12"/><circle cx="620" cy="195" r="12"/></g><circle cx="568" cy="150" r="18" fill="none" stroke="#ffb86c" stroke-width="7"/><path d="M350 190h218" stroke="#f85149" stroke-width="5" marker-end="url(#a)"/><text x="350" y="460" text-anchor="middle" class="l">几何中心</text><text x="120" y="230" class="l" fill="#58a6ff">运动参考点</text><text x="505" y="70" class="l" fill="#ffb86c">反射中心</text><text x="460" y="225" class="l" fill="#ff9a93">偏差随视角变化</text></g></svg>
