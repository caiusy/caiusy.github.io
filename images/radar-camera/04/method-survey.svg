<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Pure vision tracklet stitching method survey</title><desc id="desc">Comparison of online recovery, conservative geometry stitching, and count-constrained geometry stitching.</desc>
<rect width="1200" height="520" rx="24" fill="#0d141c"/><text x="56" y="54" fill="#f6f1e8" font-family="sans-serif" font-size="26" font-weight="700">从在线恢复到长期轨迹连接</text><text x="56" y="82" fill="#91a1ae" font-family="monospace" font-size="13">PURE VISION · GEOMETRY ONLY · ID BUDGET AUDIT</text>
<g font-family="sans-serif"><rect x="56" y="126" width="330" height="300" rx="16" fill="#17232d" stroke="#334653"/><rect x="435" y="126" width="330" height="300" rx="16" fill="#17232d" stroke="#334653"/><rect x="814" y="126" width="330" height="300" rx="16" fill="#2a2118" stroke="#bd8a55"/>
<g fill="#f2b46f" font-family="monospace" font-size="12"><text x="80" y="160">01 / ONLINE</text><text x="459" y="160">02 / CONSERVATIVE</text><text x="838" y="160">03 / COUNT TARGET</text></g><g fill="#f4f0e8" font-size="21" font-weight="700"><text x="80" y="200">Vision-TPMB</text><text x="459" y="200">Geometry stitching</text><text x="838" y="200">Long-window merge</text></g>
<g fill="#aebbc5" font-size="14"><text x="80" y="238">dormant pool</text><text x="80" y="264">low-score recovery</text><text x="80" y="290">short causal gates</text><text x="80" y="344">367 IDs</text><text x="80" y="370">+100 vs GT</text><text x="80" y="396">IDSW 22 held-out</text><text x="459" y="238">8-frame motion fit</text><text x="459" y="264">mutual best match</text><text x="459" y="290">15-frame gap</text><text x="459" y="344">319 IDs</text><text x="459" y="370">+52 vs GT</text><text x="459" y="396">IDSW 22 held-out</text><text x="838" y="238">8-frame motion fit</text><text x="838" y="264">90-frame gap</text><text x="838" y="290">count budget ≤10%</text><text x="838" y="344" fill="#ffd18b">292 IDs</text><text x="838" y="370" fill="#ffd18b">+25 / 267 = 9.36%</text><text x="838" y="396">cross-GT risk rises</text></g></g>
