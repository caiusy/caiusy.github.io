<style>text{font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#eef5ff} .title{font-size:30px;font-weight:700} .sub{font-size:16px;fill:#a8bdd3} .label{font-size:22px;font-weight:700} .small{font-size:15px;fill:#b8cce0} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<text x="54" y="64" class="title" text-anchor="start">多 Query Head，共享一个历史 Key</text><text x="54" y="96" class="sub" text-anchor="start">同一个 k₅ 被所有 q₉,ⱼ 比较；Gate 在当前 query 端混合结果。</text><rect x="80" y="135" width="240" height="66" rx="17" fill="#142b47" stroke="#5ea8ff" stroke-width="2"/><text x="100" y="172" class="label" text-anchor="start">q₉,1</text><path d="M320 168 L790 290" fill="none" stroke="#5ea8ff" stroke-width="3"  marker-end="url(#arrow)"/><rect x="80" y="225" width="240" height="66" rx="17" fill="#142b47" stroke="#73bbff" stroke-width="2"/><text x="100" y="262" class="label" text-anchor="start">q₉,2</text><path d="M320 258 L790 290" fill="none" stroke="#73bbff" stroke-width="3"  marker-end="url(#arrow)"/><rect x="80" y="315" width="240" height="66" rx="17" fill="#142b47" stroke="#4dd2ad" stroke-width="2"/><text x="100" y="352" class="label" text-anchor="start">q₉,3</text><path d="M320 348 L790 290" fill="none" stroke="#4dd2ad" stroke-width="3"  marker-end="url(#arrow)"/><rect x="80" y="405" width="240" height="66" rx="17" fill="#142b47" stroke="#f3b15b" stroke-width="2"/><text x="100" y="442" class="label" text-anchor="start">q₉,4</text><path d="M320 438 L790 290" fill="none" stroke="#f3b15b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="800" y="235" width="300" height="110" rx="17" fill="#142b47" stroke="#f3b15b" stroke-width="2"/><text x="820" y="272" class="label" text-anchor="start">共享 k₅</text><text x="820" y="300" class="small" text-anchor="start">一份 Key Cache 条目</text></svg>