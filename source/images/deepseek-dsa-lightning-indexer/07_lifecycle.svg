<style>text{font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#eef5ff} .title{font-size:30px;font-weight:700} .sub{font-size:16px;fill:#a8bdd3} .label{font-size:22px;font-weight:700} .small{font-size:15px;fill:#b8cce0} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<text x="54" y="65" class="title" text-anchor="start">Cache 生命周期：只写一次，未来复用</text><text x="54" y="96" class="sub" text-anchor="start">qₜ / gₜ 只服务当前步；kₜ 写入缓存，供以后查询。</text><rect x="54" y="160" width="285" height="85" rx="17" fill="#142b47" stroke="#5ea8ff" stroke-width="2"/><text x="74" y="197" class="label" text-anchor="start">token 8</text><text x="74" y="225" class="small" text-anchor="start">生成 q / g / k₈</text><path d="M197 247 L197 327" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="54" y="330" width="285" height="90" rx="17" fill="#142b47" stroke="#f3b15b" stroke-width="2"/><text x="74" y="367" class="label" text-anchor="start">Indexer K Cache</text><text x="74" y="395" class="small" text-anchor="start">追加 k₈，后续保留</text><path d="M340 205 L419 205" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="434" y="160" width="285" height="85" rx="17" fill="#142b47" stroke="#5ea8ff" stroke-width="2"/><text x="454" y="197" class="label" text-anchor="start">token 9</text><text x="454" y="225" class="small" text-anchor="start">生成 q / g / k₉</text><path d="M577 247 L577 327" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="434" y="330" width="285" height="90" rx="17" fill="#142b47" stroke="#f3b15b" stroke-width="2"/><text x="454" y="367" class="label" text-anchor="start">Indexer K Cache</text><text x="454" y="395" class="small" text-anchor="start">追加 k₉，后续保留</text><path d="M720 205 L799 205" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="814" y="160" width="285" height="85" rx="17" fill="#142b47" stroke="#5ea8ff" stroke-width="2"/><text x="834" y="197" class="label" text-anchor="start">token 10</text><text x="834" y="225" class="small" text-anchor="start">生成 q / g / k₁₀</text><path d="M957 247 L957 327" fill="none" stroke="#84a6c8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="814" y="330" width="285" height="90" rx="17" fill="#142b47" stroke="#f3b15b" stroke-width="2"/><text x="834" y="367" class="label" text-anchor="start">Indexer K Cache</text><text x="834" y="395" class="small" text-anchor="start">追加 k₁₀，后续保留</text></svg>