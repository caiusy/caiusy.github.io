<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#183b36}.label{font-size:21px;font-weight:600}.sub{font-size:16px;fill:#5f746b}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#779087"/></marker></defs><rect width="1000" height="480" rx="16" fill="#f1f3e9"/><text x="36" y="48" font-size="26" font-weight="700">03 / MLA 的持久状态只有两条分支</text><text x="36" y="80" class="sub">内容项与位置项相加 → 同一个 Softmax → 在潜空间汇总。</text><path d="M205 170L270 160" stroke="#779087" stroke-width="2" marker-end="url(#arrow)"/><path d="M205 205L270 310" stroke="#779087" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 155L600 155" stroke="#779087" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 285L650 205" stroke="#779087" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 205L770 265" stroke="#779087" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 330L600 330" stroke="#779087" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="140" width="170" height="90" rx="9" fill="#fff" stroke="#c3d0c4"/><text x="120.0" y="182.0" text-anchor="middle" class="label">当前 hₜ</text><text x="120.0" y="209.0" text-anchor="middle" class="sub">输入状态</text><rect x="270" y="110" width="230" height="95" rx="9" fill="#fae0c3" stroke="#c3d0c4"/><text x="385.0" y="154.5" text-anchor="middle" class="label">qᶜ / qᴿ</text><text x="385.0" y="181.5" text-anchor="middle" class="sub">当前步 Query</text><rect x="270" y="265" width="230" height="110" rx="9" fill="#dde9df" stroke="#c3d0c4"/><text x="385.0" y="317.0" text-anchor="middle" class="label">cᴷⱽ + kᴿ</text><text x="385.0" y="344.0" text-anchor="middle" class="sub">追加压缩内容与位置 Key</text><rect x="600" y="110" width="340" height="95" rx="9" fill="#fff" stroke="#c3d0c4"/><text x="770.0" y="154.5" text-anchor="middle" class="label">内容分数 + 位置分数</text><text x="770.0" y="181.5" text-anchor="middle" class="sub">除以 √(dₕ + dᴿ) 后归一化</text><rect x="600" y="265" width="340" height="110" rx="9" fill="#fff" stroke="#c3d0c4"/><text x="770.0" y="317.0" text-anchor="middle" class="label">z = αC → o = z Wᵁⱽ</text><text x="770.0" y="344.0" text-anchor="middle" class="sub">无需展开整段历史 Value</text><text x="36" y="447" class="sub">缓存 kᴿ 是缓存带内容投影的旋转 Key，不是只保存位置编号。</text></svg>