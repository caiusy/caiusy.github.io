<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">鹈鹕骑车，慢慢读懂注意力</title><desc id="desc">一只白色鹈鹕骑着墨绿色自行车，车轮和脚踏持续旋转，围巾随风摆动。</desc>
<style>
.wheel{animation:spin 2s linear infinite;transform-box:fill-box;transform-origin:center}.rider{animation:bob 1s ease-in-out infinite}.scarf{animation:flutter .65s ease-in-out infinite;transform-origin:535px 125px}.road{animation:road 2s linear infinite}.crank{animation:spin 2s linear infinite;transform-origin:510px 257px}.leg{animation:pedal 2s ease-in-out infinite;transform-origin:500px 205px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes flutter{50%{transform:rotate(-7deg)}}@keyframes road{to{transform:translateX(-110px)}}@keyframes pedal{50%{transform:rotate(-17deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
