<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect width="1200" height="560" fill="#101827"/><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#e5eefb}.head{font-size:30px;font-weight:bold}.t{font-size:23px}.small{font-size:20px;fill:#b9c8dc}.cell{fill:#1f3150;stroke:#4f6686;stroke-width:1}.a{fill:#164b43}.b{fill:#52351b}</style>
<text x="55" y="55" class="head">LoRA 与 MoE：优化维度不同</text>
<rect class="cell" x="55" y="100" width="250" height="70"/><rect class="cell" x="305" y="100" width="390" height="70"/><rect class="cell" x="695" y="100" width="450" height="70"/>
<text x="110" y="145" class="t">比较项</text><text x="430" y="145" class="t">LoRA</text><text x="850" y="145" class="t">MoE</text>
<rect class="cell" x="55" y="170" width="250" height="75"/><rect class="a" x="305" y="170" width="390" height="75"/><rect class="b" x="695" y="170" width="450" height="75"/>
<text x="110" y="218" class="t">主要目标</text><text x="385" y="218" class="t">降低微调参数量</text><text x="790" y="218" class="t">扩大参数容量</text>
<rect class="cell" x="55" y="245" width="250" height="75"/><rect class="a" x="305" y="245" width="390" height="75"/><rect class="b" x="695" y="245" width="450" height="75"/>
<text x="110" y="293" class="t">改动位置</text><text x="385" y="293" class="t">Linear 外挂低秩分支</text><text x="790" y="293" class="t">FFN 替换为多 Expert</text>
<rect class="cell" x="55" y="320" width="250" height="75"/><rect class="a" x="305" y="320" width="390" height="75"/><rect class="b" x="695" y="320" width="450" height="75"/>
<text x="110" y="368" class="t">核心机制</text><text x="385" y="368" class="t">ΔW ≈ BA</text><text x="790" y="368" class="t">Router + Top-K</text>
<rect class="cell" x="55" y="395" width="250" height="75"/><rect class="a" x="305" y="395" width="390" height="75"/><rect class="b" x="695" y="395" width="450" height="75"/>
<text x="110" y="443" class="t">项目开关</text><text x="385" y="443" class="t">apply_lora(model)</text><text x="790" y="443" class="t">use_moe=1</text>
<text x="55" y="520" class="small">一句话：LoRA 让训练更便宜，MoE 让模型容量更大。</text>
</svg>
