<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">看见偏差，不等于找到原因</title><desc id="desc">先排时间、坐标和参考点，再判断传感器质量。；方法示意，不代表实验结果。</desc><rect width="1200" height="715" fill="#f3f6fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#18324d"><text x="54" y="65" font-size="34" font-weight="700">看见偏差，不等于找到原因</text><text x="54" y="108" font-size="21" fill="#526b84">先排时间、坐标和参考点，再判断传感器质量。</text><rect x="54" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="174" width="6" height="38" rx="3" fill="#2979c7"/><text x="79" y="202" font-size="25" font-weight="700" fill="#2979c7">随车速增大而增大的沿路偏差</text><text x="79" y="246" font-size="21">候选原因：固定时间延迟</text><text x="79" y="280" font-size="21">用运动片段估计，留出片段验证</text><text x="79" y="314" font-size="21">停车片段通常难辨识时间偏移</text><rect x="612" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="174" width="6" height="38" rx="3" fill="#16846a"/><text x="637" y="202" font-size="25" font-weight="700" fill="#16846a">远处横向偏差呈扇形放大</text><text x="637" y="246" font-size="21">候选原因：航向外参或角度误差</text><text x="637" y="280" font-size="21">也可能来自相机地面投影</text><text x="637" y="314" font-size="21">按距离和方位分组，检查静态参照</text><rect x="54" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="404" width="6" height="38" rx="3" fill="#bb7130"/><text x="79" y="432" font-size="25" font-weight="700" fill="#bb7130">转弯后偏差方向跟着车身变化</text><text x="79" y="476" font-size="21">候选原因：反射点与中心不同</text><text x="79" y="510" font-size="21">不要用一个平移量硬补所有车辆</text><text x="79" y="544" font-size="21">按朝向与尺寸检查参考点差异</text><rect x="612" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="404" width="6" height="38" rx="3" fill="#7961ae"/><text x="637" y="432" font-size="25" font-weight="700" fill="#7961ae">会车时残差骤增或身份跳转</text><text x="637" y="476" font-size="21">候选原因：关联错车或遮挡</text><text x="637" y="510" font-size="21">回看候选配对与轨迹历史</text><text x="637" y="544" font-size="21">单看平均残差可能掩盖串轨</text><text x="54" y="680" font-size="20" fill="#526b84">这些是诊断线索，不是仅凭图形就能成立的因果结论。</text></g></svg>