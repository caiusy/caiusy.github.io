<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">只有一个强度值，也能研究，但别把它叫置信度</title><desc id="desc">输入是每个目标、每个时刻的一个标量；不是一簇点云。；方法示意，不代表实验结果。</desc><rect width="1200" height="715" fill="#f3f6fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#18324d"><text x="54" y="65" font-size="34" font-weight="700">只有一个强度值，也能研究，但别把它叫置信度</text><text x="54" y="108" font-size="21" fill="#526b84">输入是每个目标、每个时刻的一个标量；不是一簇点云。</text><rect x="54" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="174" width="6" height="38" rx="3" fill="#2979c7"/><text x="79" y="202" font-size="25" font-weight="700" fill="#2979c7">字段核验</text><text x="79" y="246" font-size="21">查单位、有效范围、饱和与缺失码</text><text x="79" y="280" font-size="21">区分幅度、功率、RCS 与未知标度</text><text x="79" y="314" font-size="21">定义不清时，先按原始标量处理</text><rect x="612" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="174" width="6" height="38" rx="3" fill="#16846a"/><text x="637" y="202" font-size="25" font-weight="700" fill="#16846a">因果可用的时间特征</text><text x="637" y="246" font-size="21">只使用当前及过去的强度</text><text x="637" y="280" font-size="21">计算过去窗口的中位数与波动</text><text x="637" y="314" font-size="21">不使用未来帧或完整轨迹寿命</text><rect x="54" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="404" width="6" height="38" rx="3" fill="#bb7130"/><text x="79" y="432" font-size="25" font-weight="700" fill="#bb7130">控制混杂因素</text><text x="79" y="476" font-size="21">在相近距离、方位、类别内比较</text><text x="79" y="510" font-size="21">设备与会话之间检查分布漂移</text><text x="79" y="544" font-size="21">归一化参数只从训练集估计</text><rect x="612" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="404" width="6" height="38" rx="3" fill="#7961ae"/><text x="637" y="432" font-size="25" font-weight="700" fill="#7961ae">三个对照组</text><text x="637" y="476" font-size="21">A 不用强度；B 使用真实强度</text><text x="637" y="510" font-size="21">C 在条件分箱内随机打乱强度</text><text x="637" y="544" font-size="21">B 要优于 A，也要优于 C</text><text x="54" y="680" font-size="20" fill="#526b84">强度高不保证定位准；反射强的静态物体或多径目标也可能持续出现。</text></g></svg>