<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">融合不是一个权重，而是一组使用权限</title><desc id="desc">所有分支先检查：新鲜度、身份关联与各维度可靠性。；方法示意，不代表实验结果。</desc><rect width="1200" height="715" fill="#f3f6fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#18324d"><text x="54" y="65" font-size="34" font-weight="700">融合不是一个权重，而是一组使用权限</text><text x="54" y="108" font-size="21" fill="#526b84">所有分支先检查：新鲜度、身份关联与各维度可靠性。</text><rect x="54" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="174" width="6" height="38" rx="3" fill="#2979c7"/><text x="79" y="202" font-size="25" font-weight="700" fill="#2979c7">位置可靠 + 速度可靠</text><text x="79" y="246" font-size="21">允许位置和速度更新</text><text x="79" y="280" font-size="21">分别设置不确定度</text><text x="79" y="314" font-size="21">持续检查残差与关联竞争</text><rect x="612" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="174" width="6" height="38" rx="3" fill="#16846a"/><text x="637" y="202" font-size="25" font-weight="700" fill="#16846a">位置不稳 + 速度有用</text><text x="637" y="246" font-size="21">只更新经验证的速度分量</text><text x="637" y="280" font-size="21">位置来源由独立证据决定</text><text x="637" y="314" font-size="21">避免可疑位置把轨迹拉向邻车</text><rect x="54" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="404" width="6" height="38" rx="3" fill="#bb7130"/><text x="79" y="432" font-size="25" font-weight="700" fill="#bb7130">视觉退化 + 雷达持续有效</text><text x="79" y="476" font-size="21">允许雷达维持已有轨迹</text><text x="79" y="510" font-size="21">新生目标采用更严格确认</text><text x="79" y="544" font-size="21">类别可暂存，但标记陈旧程度</text><rect x="612" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="404" width="6" height="38" rx="3" fill="#7961ae"/><text x="637" y="432" font-size="25" font-weight="700" fill="#7961ae">没有任何有效的新观测</text><text x="637" y="476" font-size="21">进入限时预测，扩大不确定度</text><text x="637" y="510" font-size="21">超时转休眠或结束轨迹</text><text x="637" y="544" font-size="21">与持续收到有效雷达严格区分</text><text x="54" y="680" font-size="20" fill="#526b84">策略切换应有迟滞：单帧异常可立即降权，恢复则需要连续证据。</text></g></svg>