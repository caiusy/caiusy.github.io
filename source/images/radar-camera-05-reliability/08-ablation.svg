<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">对照实验：每次只增加一种信息</title><desc id="desc">固定数据划分、检测输入、关联规则和评估器，再比较边际价值。；方法示意，不代表实验结果。</desc><rect width="1200" height="715" fill="#f3f6fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#18324d"><text x="54" y="65" font-size="34" font-weight="700">对照实验：每次只增加一种信息</text><text x="54" y="108" font-size="21" fill="#526b84">固定数据划分、检测输入、关联规则和评估器，再比较边际价值。</text><rect x="54" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="174" width="6" height="38" rx="3" fill="#2979c7"/><text x="79" y="202" font-size="25" font-weight="700" fill="#2979c7">第一层：信息有没有价值？</text><text x="79" y="246" font-size="21">A 纯视觉；B 纯雷达</text><text x="79" y="280" font-size="21">C 视觉 + 雷达位置</text><text x="79" y="314" font-size="21">D 视觉 + 雷达速度</text><rect x="612" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="174" width="6" height="38" rx="3" fill="#16846a"/><text x="637" y="202" font-size="25" font-weight="700" fill="#16846a">第二层：策略有没有价值？</text><text x="637" y="246" font-size="21">E 位置 + 速度固定融合</text><text x="637" y="280" font-size="21">F 分维度自适应融合</text><text x="637" y="314" font-size="21">保持相同输入与调参预算</text><rect x="54" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="404" width="6" height="38" rx="3" fill="#bb7130"/><text x="79" y="432" font-size="25" font-weight="700" fill="#bb7130">第三层：强度有没有价值？</text><text x="79" y="476" font-size="21">在 F 上增加真实强度</text><text x="79" y="510" font-size="21">对照条件分箱内打乱强度</text><text x="79" y="544" font-size="21">检查收益是否跨片段稳定</text><rect x="612" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="404" width="6" height="38" rx="3" fill="#7961ae"/><text x="637" y="432" font-size="25" font-weight="700" fill="#7961ae">第四层：完整方法比较</text><text x="637" y="476" font-size="21">目标级输入与点云输入分表</text><text x="637" y="510" font-size="21">记录额外关键点和预训练信息</text><text x="637" y="544" font-size="21">不把额外信息收益归为算法收益</text><text x="54" y="680" font-size="20" fill="#526b84">同时报告 FP/FN、身份切换、定位/预测误差、覆盖率、延迟及失败片段。</text></g></svg>