<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">一个完整的判断例子：保留速度，暂缓位置</title><desc id="desc">纯教学案例：所有数值为虚构，不代表任何设备或数据集结果。；方法示意，不代表实验结果。</desc><rect width="1200" height="715" fill="#f3f6fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#18324d"><text x="54" y="65" font-size="34" font-weight="700">一个完整的判断例子：保留速度，暂缓位置</text><text x="54" y="108" font-size="21" fill="#526b84">纯教学案例：所有数值为虚构，不代表任何设备或数据集结果。</text><rect x="54" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="174" width="6" height="38" rx="3" fill="#2979c7"/><text x="79" y="202" font-size="25" font-weight="700" fill="#2979c7">发现问题</text><text x="79" y="246" font-size="21">同一目标雷视位置相差约 3 m</text><text x="79" y="280" font-size="21">确认时间、坐标与参考点定义</text><text x="79" y="314" font-size="21">排除邻车竞争后再评价传感器</text><rect x="612" y="150" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="174" width="6" height="38" rx="3" fill="#16846a"/><text x="637" y="202" font-size="25" font-weight="700" fill="#16846a">拆分证据</text><text x="637" y="246" font-size="21">独立标签显示视觉位置更准</text><text x="637" y="280" font-size="21">留出集：视觉 1 s 预测误差 1.8 m</text><text x="637" y="314" font-size="21">加入雷达速度后降到 0.9 m</text><rect x="54" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="54" y="404" width="6" height="38" rx="3" fill="#bb7130"/><text x="79" y="432" font-size="25" font-weight="700" fill="#bb7130">决定动作</text><text x="79" y="476" font-size="21">该条件下允许雷达速度更新</text><text x="79" y="510" font-size="21">暂不使用有偏的雷达位置</text><text x="79" y="544" font-size="21">仍需检查更远处及转弯场景</text><rect x="612" y="380" width="534" height="205" rx="20" fill="white" stroke="#d8e2ec"/><rect x="612" y="404" width="6" height="38" rx="3" fill="#7961ae"/><text x="637" y="432" font-size="25" font-weight="700" fill="#7961ae">遇到视觉缺测</text><text x="637" y="476" font-size="21">有新鲜可靠雷达：继续观测更新</text><text x="637" y="510" font-size="21">仅位置可疑：速度更新并扩大位置不确定度</text><text x="637" y="544" font-size="21">两者都缺失：进入有期限的预测</text><text x="54" y="680" font-size="20" fill="#526b84">单个例子用来解释流程；是否可部署仍取决于足够多独立片段的验证。</text></g></svg>