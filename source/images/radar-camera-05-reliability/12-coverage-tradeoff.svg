<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">只看误差下降，可能误把“拒绝更多”当成进步</title><desc id="desc">人工构造的阈值扫描示意；真正评估时，需要用留出数据重新绘制。</desc><rect width="1200" height="720" fill="#f3f6fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="50" y="65" font-size="32" fill="#18324d">只看误差下降，可能误把“拒绝更多”当成进步</text><text x="50" y="108" font-size="21" fill="#526b84">人工构造的阈值扫描示意；真正评估时，需要用留出数据重新绘制。</text><rect x="80" y="150" width="1040" height="470" rx="16" fill="white"/><path d="M 160 210 V 540 H 1040" stroke="#526b84" fill="none" stroke-width="2"/><text x="130" y="190" font-size="21" fill="#18324d">保留目标的误差（示意）</text><text x="770" y="590" font-size="21" fill="#18324d">有效覆盖率 →</text><polyline points="250,470 410,420 580,365 760,320 960,280" fill="none" stroke="#2979c7" stroke-width="4"/><circle cx="250" cy="470" r="8" fill="#2979c7"/><circle cx="410" cy="420" r="8" fill="#2979c7"/><circle cx="580" cy="365" r="8" fill="#2979c7"/><circle cx="760" cy="320" r="8" fill="#2979c7"/><circle cx="960" cy="280" r="8" fill="#2979c7"/><text x="230" y="512" font-size="20" fill="#18324d">拒绝很多，只留下容易目标</text><text x="700" y="245" font-size="20" fill="#18324d">保留更多，也接纳困难目标</text><text x="50" y="665" font-size="22" fill="#18324d">报告同一阈值下的误差、覆盖率和失败事件；还要比较相同覆盖率下的不同方法。</text></g></svg>