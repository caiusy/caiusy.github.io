<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="t d">
<title id="t">雷达数据五层结构</title><desc id="d">ADC与RAD经过检测、跟踪，最终才能与相机形成跨模态真值</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071b2c"/><stop offset="1" stop-color="#123f52"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#78dce8"/></marker></defs>
<rect width="1440" height="820" rx="34" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" fill="#eefcff"><text x="80" y="95" font-size="46" font-weight="700">从回波到可评测融合：不是同一个“雷达数据”</text><text x="80" y="145" font-size="24" fill="#acd6df">原创示意图 · 每向上一层都增加假设，也损失部分原始信息</text></g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle"><g fill="#113247" stroke="#4aa8c1" stroke-width="3"><rect x="90" y="245" width="220" height="185" rx="24"/><rect x="350" y="245" width="220" height="185" rx="24"/><rect x="610" y="245" width="220" height="185" rx="24"/><rect x="870" y="245" width="220" height="185" rx="24"/><rect x="1130" y="245" width="220" height="185" rx="24"/></g><g fill="#f5fbff"><text x="200" y="305" font-size="30" font-weight="700">ADC / Cube</text><text x="460" y="305" font-size="30" font-weight="700">RAD / RA</text><text x="720" y="305" font-size="30" font-weight="700">点云 / 检测</text><text x="980" y="305" font-size="30" font-weight="700">厂商 Track</text><text x="1240" y="305" font-size="30" font-weight="700">跨模态 GT</text></g><g fill="#bad9e2" font-size="21"><text x="200" y="355">chirp · antenna</text><text x="200" y="388">sample</text><text x="460" y="355">range · azimuth</text><text x="460" y="388">Doppler · energy</text><text x="720" y="355">x y z · RCS</text><text x="720" y="388">一帧多个点</text><text x="980" y="355">ID · position</text><text x="980" y="388">velocity · size</text><text x="1240" y="355">统一身份</text><text x="1240" y="388">框 · 轨迹 · 对应</text></g></g>
<g stroke="#78dce8" stroke-width="5" marker-end="url(#a)"><path d="M310 338h30"/><path d="M570 338h30"/><path d="M830 338h30"/><path d="M1090 338h30"/></g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="150" y="535" width="1140" height="160" rx="26" fill="#0c2839" stroke="#f5a65b" stroke-width="3"/><text x="190" y="590" fill="#ffd9ad" font-size="28" font-weight="700">关键提醒</text><text x="190" y="640" fill="#f4fbff" font-size="27">Radar Track ID 只保证雷达内部连续性；它通常不是 Camera Track ID，更不是跨模态真值 ID。</text><text x="190" y="680" fill="#b9d7df" font-size="22">发布前必须分别核对：同步时钟、坐标标定、身份定义与数据许可。</text></g>
</svg>
