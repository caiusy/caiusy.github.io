<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="t d"><title id="t">异步雷达与相机时间轴</title><desc id="d">相机帧位于两帧雷达轨迹之间，需要插值但插值不等于关联</desc><rect width="1440" height="760" rx="34" fill="#081c2b"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="80" y="90" fill="#f4fbff" font-size="44" font-weight="700">同步只是第一关：时间对齐 ≠ 目标关联</text><text x="80" y="140" fill="#9fc9d4" font-size="24">原创示意图 · 教学时间戳，不是任何数据集实测</text><g stroke="#557889" stroke-width="4"><path d="M190 300h1080"/><path d="M190 520h1080"/></g><text x="70" y="310" fill="#78dce8" font-size="28">Radar</text><text x="70" y="530" fill="#ffb86c" font-size="28">Camera</text><g fill="#78dce8"><circle cx="300" cy="300" r="17"/><circle cx="700" cy="300" r="17"/><circle cx="1100" cy="300" r="17"/></g><g fill="#ffb86c"><rect x="435" y="497" width="34" height="46" rx="6"/><rect x="835" y="497" width="34" height="46" rx="6"/></g><g fill="#dceef3" font-size="22" text-anchor="middle"><text x="300" y="350">10.000 s</text><text x="700" y="350">10.100 s</text><text x="1100" y="350">10.200 s</text><text x="452" y="575">10.040 s</text><text x="852" y="575">10.140 s</text></g><path d="M452 480V380M852 480V380" stroke="#ffb86c" stroke-width="3" stroke-dasharray="10 8"/><rect x="275" y="625" width="890" height="75" rx="18" fill="#102f42"/><text x="720" y="674" fill="#f5fbff" font-size="25" text-anchor="middle">插值得到同一时刻的位置后，仍需空间门控、类别/速度一致性和身份管理</text></g></svg>
