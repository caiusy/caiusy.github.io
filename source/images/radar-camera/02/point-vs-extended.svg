<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="t d"><title id="t">点目标与扩展目标</title><desc id="d">同一车辆可由一个中心点表示，也可产生多个分散雷达反射点</desc><rect width="1440" height="820" rx="34" fill="#081b2a"/><style>.h{font:700 44px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f4fbff}.s{font:400 23px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#a7cbd5}.l{font:700 30px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f4fbff}</style><text x="80" y="90" class="h">同一辆车，两种建模假设</text><text x="80" y="138" class="s">原创教学示意 · 蓝色十字是参考中心，橙点是雷达反射点</text><rect x="90" y="210" width="590" height="500" rx="28" fill="#102f42" stroke="#3d7085"/><rect x="760" y="210" width="590" height="500" rx="28" fill="#102f42" stroke="#3d7085"/><text x="385" y="270" text-anchor="middle" class="l">点目标</text><text x="1055" y="270" text-anchor="middle" class="l">扩展目标（EOT）</text><g transform="translate(180 360)"><path d="M20 80L75 20h250l75 60v130H20z" fill="#235a75" stroke="#78dce8" stroke-width="5"/><circle cx="110" cy="210" r="38" fill="#071722" stroke="#9acbd8" stroke-width="8"/><circle cx="315" cy="210" r="38" fill="#071722" stroke="#9acbd8" stroke-width="8"/><path d="M210 88v40M190 108h40" stroke="#ffb86c" stroke-width="9"/><text x="210" y="290" text-anchor="middle" class="s">一帧最多一个测量</text></g><g transform="translate(850 360)"><path d="M20 80L75 20h250l75 60v130H20z" fill="#235a75" stroke="#78dce8" stroke-width="5"/><circle cx="110" cy="210" r="38" fill="#071722" stroke="#9acbd8" stroke-width="8"/><circle cx="315" cy="210" r="38" fill="#071722" stroke="#9acbd8" stroke-width="8"/><g fill="#ffb86c"><circle cx="43" cy="103" r="12"/><circle cx="92" cy="66" r="12"/><circle cx="154" cy="74" r="12"/><circle cx="232" cy="52" r="12"/><circle cx="324" cy="74" r="12"/><circle cx="378" cy="120" r="12"/><circle cx="278" cy="164" r="12"/></g><path d="M210 88v40M190 108h40" stroke="#f4fbff" stroke-width="7"/><text x="210" y="290" text-anchor="middle" class="s">一帧多个测量 + 形状</text></g></svg>
