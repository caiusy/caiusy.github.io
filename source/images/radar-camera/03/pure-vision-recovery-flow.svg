<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Pure-vision MTPMB-style identity recovery pipeline</title>
  <desc id="desc">Camera frame goes to CenterNet direct XYZ, then an MTPMB-style Vision-TPMB association stage, active and dormant tracks, and low-score recovery without new births.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#17212b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6a86b"/>
      <stop offset="1" stop-color="#ffd18a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>
  <path d="M0 92H1200M0 188H1200M0 284H1200M0 380H1200" stroke="#ffffff" stroke-opacity=".045"/>
  <path d="M92 0V480M292 0V480M492 0V480M692 0V480M892 0V480M1092 0V480" stroke="#ffffff" stroke-opacity=".035"/>
  <text x="56" y="52" fill="#f4f0e8" font-family="ui-sans-serif, sans-serif" font-size="24" font-weight="700">Pure-camera 3D tracking with identity recovery</text>
  <text x="56" y="78" fill="#8fa1af" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">IMAGE ONLY  /  DIRECT XYZ  /  MTPMB-STYLE  /  NO RADAR</text>

  <g filter="url(#shadow)">
    <rect x="56" y="132" width="190" height="112" rx="14" fill="#141e27" stroke="#334653"/>
    <rect x="292" y="132" width="220" height="112" rx="14" fill="#141e27" stroke="#334653"/>
    <rect x="558" y="132" width="220" height="112" rx="14" fill="#141e27" stroke="#334653"/>
    <rect x="824" y="132" width="320" height="112" rx="14" fill="#141e27" stroke="#334653"/>
  </g>
  <g fill="#f6a86b" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">
    <text x="76" y="160">01 / INPUT</text>
    <text x="312" y="160">02 / DETECTOR</text>
    <text x="578" y="160">03 / ASSOCIATION</text>
    <text x="844" y="160">04 / IDENTITY STATE</text>
  </g>
  <g fill="#f4f0e8" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="600">
    <text x="76" y="195">Camera frame</text>
    <text x="312" y="195">CenterNet</text>
    <text x="578" y="195">MTPMB-style K=5</text>
    <text x="844" y="195">Confirmed track</text>
  </g>
  <g fill="#91a2af" font-family="ui-sans-serif, sans-serif" font-size="12">
    <text x="76" y="220">no radar or GT at inference</text>
    <text x="312" y="220">XYZ · size · SO(3) · class</text>
    <text x="578" y="220">PPP + Murty + moment match</text>
    <text x="844" y="220">same public ID while observed</text>
  </g>

  <g stroke="url(#accent)" stroke-width="2" fill="none">
    <path d="M246 188H286"/>
    <path d="M512 188H552"/>
    <path d="M778 188H818"/>
    <path d="M984 244V300H704V340"/>
    <path d="M704 300H984V340"/>
  </g>
  <g fill="#f6a86b">
    <path d="M286 183l10 5-10 5z"/>
    <path d="M552 183l10 5-10 5z"/>
    <path d="M818 183l10 5-10 5z"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="604" y="300" width="200" height="96" rx="14" fill="#201b18" stroke="#8d5c3b"/>
    <rect x="844" y="300" width="280" height="96" rx="14" fill="#201b18" stroke="#8d5c3b"/>
  </g>
  <text x="624" y="328" fill="#ffd18a" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">DORMANT POOL</text>
  <text x="624" y="354" fill="#f4f0e8" font-family="ui-sans-serif, sans-serif" font-size="17" font-weight="600">1 s ID reservation</text>
  <text x="624" y="377" fill="#b9a28e" font-family="ui-sans-serif, sans-serif" font-size="12">no output while dormant</text>
  <text x="864" y="328" fill="#ffd18a" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">RECOVERY GATE</text>
  <text x="864" y="354" fill="#f4f0e8" font-family="ui-sans-serif, sans-serif" font-size="17" font-weight="600">position + heading + size</text>
  <text x="864" y="377" fill="#b9a28e" font-family="ui-sans-serif, sans-serif" font-size="12">low-score detections cannot birth</text>

  <path d="M864 300V260H1070V244" stroke="#ffd18a" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
  <text x="884" y="284" fill="#ffd18a" font-family="ui-monospace, monospace" font-size="11">reuse existing public ID</text>

  <rect x="56" y="416" width="1088" height="34" rx="10" fill="#101820" stroke="#2d3d48"/>
  <text x="76" y="438" fill="#9eabb5" font-family="ui-sans-serif, sans-serif" font-size="12">Safety rule: low-score recovery updates position only; class, pose and dimensions remain from the last reliable observation.</text>
  <circle cx="1132" cy="433" r="5" fill="#f6a86b"/>
</svg>
