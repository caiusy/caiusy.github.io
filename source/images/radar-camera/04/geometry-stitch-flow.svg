<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Geometry-only tracklet stitching flow</title><desc id="desc">Tracklets are connected using bidirectional 3D motion, speed, heading, size and class, without image appearance.</desc>
<rect width="1200" height="460" rx="24" fill="#0b1118"/><text x="54" y="52" fill="#f5f0e8" font-family="sans-serif" font-size="25" font-weight="700">不看图像，如何连接断裂轨迹</text><text x="54" y="80" fill="#8fa1af" font-family="monospace" font-size="12">3D MOT / TRACKLET GRAPH / NO HSV / NO RADAR / NO GT</text>
<g font-family="sans-serif"><g><rect x="54" y="138" width="204" height="112" rx="14" fill="#17232d" stroke="#385061"/><text x="76" y="170" fill="#f2b46f" font-family="monospace" font-size="12">A / ENDED</text><text x="76" y="204" fill="#f4f0e8" font-size="19" font-weight="700">Tracklet A</text><text x="76" y="230" fill="#aebbc5" font-size="13">last 8 XYZ states</text></g><g><rect x="330" y="138" width="240" height="112" rx="14" fill="#17232d" stroke="#385061"/><text x="352" y="170" fill="#f2b46f" font-family="monospace" font-size="12">B / PREDICT</text><text x="352" y="204" fill="#f4f0e8" font-size="19" font-weight="700">Bidirectional motion</text><text x="352" y="230" fill="#aebbc5" font-size="13">forward + backward error</text></g><g><rect x="642" y="138" width="220" height="112" rx="14" fill="#17232d" stroke="#385061"/><text x="664" y="170" fill="#f2b46f" font-family="monospace" font-size="12">C / GATE</text><text x="664" y="204" fill="#f4f0e8" font-size="19" font-weight="700">Geometry checks</text><text x="664" y="230" fill="#aebbc5" font-size="13">speed · yaw · size · class</text></g><g><rect x="934" y="138" width="212" height="112" rx="14" fill="#2a2118" stroke="#bd8a55"/><text x="956" y="170" fill="#ffd18b" font-family="monospace" font-size="12">D / MERGE</text><text x="956" y="204" fill="#f4f0e8" font-size="19" font-weight="700">Reuse earliest ID</text><text x="956" y="230" fill="#cdb28f" font-size="13">rewrite history + template</text></g></g>
<g stroke="#f2b46f" stroke-width="3"><path d="M258 194h62m250 0h62m290 0h62"/></g><g fill="#f2b46f"><path d="M312 186l12 8-12 8z"/><path d="M624 186l12 8-12 8z"/><path d="M916 186l12 8-12 8z"/></g><rect x="54" y="310" width="1092" height="76" rx="14" fill="#121b23" stroke="#293944"/><text x="78" y="340" fill="#f4f0e8" font-family="sans-serif" font-size="16" font-weight="700">安全边界</text><text x="78" y="367" fill="#aebbc5" font-family="sans-serif" font-size="14">候选轨迹必须时间不重叠，并通过互选唯一最佳连接；放宽时间窗可以降低 ID 数，但会增加跨目标串联风险。</text></svg>
