<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雷视融合交互实验室</title><style>:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--blue:#58a6ff;--orange:#ffa657;--green:#3fb950;--red:#f85149;--text:#e6edf3;--muted:#8b949e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:34px 20px}h1{font-size:clamp(30px,5vw,54px);line-height:1.15}h1 span{color:var(--blue)}h2{margin-top:38px}.note{color:var(--muted);border-left:3px solid var(--orange);padding:10px 14px;background:#111820}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}label{display:block;margin:12px 0;color:var(--muted)}input[type=range]{width:100%}button{background:var(--blue);border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}canvas{width:100%;height:230px;background:#0b1219;border:1px solid var(--line);border-radius:10px}svg{width:100%;height:auto;background:#0b1219;border:1px solid var(--line);border-radius:10px}.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:#19334d;color:#9ecbff;margin:3px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>雷视融合<span>交互实验室</span></h1><p>把数据层级、反射点和关联门限变成可拖动的教学实验。</p><p class="note">本页全部数字均为合成演示，不是论文结果，也不是你的系统实测。实验目的只是帮助理解输入差异与参数敏感性。</p><section class="grid"><div class="card"><h2>实验 A：数据层级检查</h2><p>勾选你拥有的输入，页面给出“可做什么”的保守判断。</p><label><input type="checkbox" class="cap" value="rad"> RAD / RA 热力图</label><label><input type="checkbox" class="cap" value="pc"> 雷达点云</label><label><input type="checkbox" class="cap" value="track"> 厂商 Radar Track</label><label><input type="checkbox" class="cap" value="cam"> 同步相机检测</label><label><input type="checkbox" class="cap" value="gt"> 跨模态 GT</label><button id="check">检查兼容任务</button><p id="advice" class="note">请先选择输入。</p></div><div class="card"><h2>实验 B：Point vs EOT</h2><p>增加反射点数量和噪声，观察中心估计误差（演示模型）。</p><label>反射点数量：<output id="nval">8</output><input id="n" type="range" min="1" max="30" value="8"></label><label>反射噪声：<output id="sval">0.30</output> m<input id="sigma" type="range" min="0" max="100" value="30"></label><canvas id="plot" width="900" height="460"></canvas><p id="metric" class="note"></p></div></section><section><h2>机制草图</h2><svg viewBox="0 0 900 250" role="img" aria-label="雷达点到融合轨迹的演示流程"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#58a6ff"/></marker></defs><g font-family="sans-serif" text-anchor="middle" fill="#e6edf3"><rect x="30" y="80" width="170" height="85" rx="12" fill="#19334d" stroke="#58a6ff"/><text x="115" y="115">RAD / 点云</text><text x="115" y="145" font-size="13" fill="#8b949e">原始或点级输入</text><rect x="265" y="80" width="170" height="85" rx="12" fill="#3a2b1b" stroke="#ffa657"/><text x="350" y="115">检测 / 分区</text><text x="350" y="145" font-size="13" fill="#8b949e">门控与测量模型</text><rect x="500" y="80" width="170" height="85" rx="12" fill="#173521" stroke="#3fb950"/><text x="585" y="115">Track / EOT</text><text x="585" y="145" font-size="13" fill="#8b949e">状态与形状</text><rect x="735" y="80" width="135" height="85" rx="12" fill="#3a2020" stroke="#f85149"/><text x="802" y="115">融合评测</text><text x="802" y="145" font-size="13" fill="#8b949e">需 GT</text></g><g stroke="#58a6ff" stroke-width="3" marker-end="url(#arr)"><path d="M200 122h65"/><path d="M435 122h65"/><path d="M670 122h65"/></g></svg></section><p class="note">下一步：把合成输入替换成真实日志时，先保留时间戳、坐标系、单位、ID 生命周期和原始文件哈希。</p></main><script>const q=s=>document.querySelector(s);q('#check').onclick=()=>{const a=[...document.querySelectorAll('.cap:checked')].map(x=>x.value);let t='';if(a.includes('track')&&a.includes('cam'))t+='可做 Track 级空间/运动关联；';if(a.includes('pc'))t+='可研究点级 EOT/分区；';if(a.includes('rad'))t+='可研究 RAD 检测网络，但不能凭 RAD 得到稳定 ID；';if(a.includes('gt'))t+='可做身份指标评测；';q('#advice').textContent=t||'当前输入不足以支撑完整雷视融合评测。'};const c=q('#plot'),x=c.getContext('2d');function draw(){const n=+q('#n').value,s=+q('#sigma').value/100;q('#nval').textContent=n;q('#sval').textContent=s.toFixed(2);x.clearRect(0,0,c.width,c.height);x.strokeStyle='#30363d';x.beginPath();x.moveTo(60,220);x.lineTo(850,220);x.moveTo(60,30);x.lineTo(60,220);x.stroke();x.strokeStyle='#58a6ff';x.beginPath();for(let i=0;i<n;i++){const px=140+i*620/Math.max(1,n-1),py=120+Math.sin(i*2.3)*70*s;x.lineTo(px,py)}x.stroke();const err=(s/Math.sqrt(n))*1.6;q('#metric').textContent='演示中心误差 ≈ '+err.toFixed(3)+' m；这是人为设定的简化关系，不是统计估计。'}q('#n').oninput=draw;q('#sigma').oninput=draw;draw();</script></body></html>
